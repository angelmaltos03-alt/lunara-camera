name: iOS build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build for iOS Simulator
        run: xcodebuild -project LunaraCamera/LunaraCamera.xcodeproj -scheme LunaraCamera -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
